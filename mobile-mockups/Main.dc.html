<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #17a398; text-decoration: none; }
    a:hover { color: #108a7f; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 820px; background: #f4faf9; font-family: Poppins, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0a2a43; display: flex; flex-direction: column;">

  <!-- Hero band -->
  <div style="position: relative; overflow: hidden; padding: 56px 32px 60px; background: linear-gradient(158deg, #0a2a43 0%, #0d3a54 55%, #17a398 145%); text-align: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="width: 64px; height: 64px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7fe3d9" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-family: Lora, Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 600; letter-spacing: 0.14em; color: #ffffff;">FINOOCEAN</div>
        <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.68);">Loan management platform</div>
      </div>
    </div>
    <svg viewBox="0 0 480 40" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 26px; display: block;">
      <path d="M0,20 C80,40 160,0 240,20 C320,40 400,0 480,20 L480,40 L0,40 Z" fill="#f4faf9"/>
    </svg>
  </div>

  <!-- Sign-in card -->
  <div style="margin: -36px 20px 0; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 16px rgba(16,24,40,0.08), 0 4px 6px rgba(16,24,40,0.06); padding: 24px; display: flex; flex-direction: column; gap: 18px; position: relative;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: Lora, Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 600;">Sign in</div>
      <div style="font-size: 13px; color: #4b5565;">Welcome back — enter your details to continue.</div>
    </div>

    <!-- Email field (outlined) -->
    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 500; color: #4b5565;">Email address</span>
      <span style="display: flex; align-items: center; gap: 10px; border: 1px solid #bcd2d6; border-radius: 8px; padding: 0 12px; height: 48px; background: #ffffff;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8792a2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span style="flex: 1; font-size: 14px; color: #0a2a43;">priya.nair@finoocean.in</span>
      </span>
    </label>

    <!-- Password field (outlined, focused state) -->
    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 500; color: #0a2a43;">Password</span>
      <span style="display: flex; align-items: center; gap: 10px; border: 1px solid #0a2a43; border-radius: 8px; padding: 0 12px; height: 48px; background: #ffffff; box-shadow: 0 0 0 3px rgba(10,42,67,0.08);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a2a43" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span style="flex: 1; font-size: 16px; letter-spacing: 0.14em; color: #0a2a43;">•••••••••</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8792a2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
    </label>

    <div style="display: flex; justify-content: flex-end; margin-top: -4px;">
      <a href="#" style="font-size: 12.5px; font-weight: 500;">Forgot password?</a>
    </div>

    <button style="appearance: none; border: 0; cursor: pointer; width: 100%; height: 48px; border-radius: 999px; background: #e85a3b; color: #ffffff; font-family: Poppins, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; box-shadow: 0 12px 24px -6px rgba(232,90,59,0.45); display: flex; align-items: center; justify-content: center; gap: 8px;">
      Sign in
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
  </div>

  <div style="margin-top: auto; padding: 28px 32px 34px; text-align: center; font-size: 12px; color: #8792a2;">
    Need access? Contact your workspace administrator.
  </div>
</div>
</x-dc>
</body>
</html>
