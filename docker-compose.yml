services:
  mysql:
    image: mysql:8.0
    container_name: finoocean-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finoocean
      MYSQL_USER: finoocean
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: finoocean-backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: finoocean
      DB_USERNAME: finoocean
      DB_PASSWORD: secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: finoocean-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm start -- --host 0.0.0.0 --poll 1000

volumes:
  mysql-data:
