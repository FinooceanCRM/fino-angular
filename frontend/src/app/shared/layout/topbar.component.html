<mat-toolbar color="primary" class="topbar tide-shoreline">
  @if (auth.isAuthenticated()) {
    <button
      mat-icon-button
      type="button"
      class="topbar__menu"
      (click)="menuToggle.emit()"
      aria-label="Toggle navigation"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }

  <a routerLink="/" class="topbar__brand">
    <span class="topbar__brand-icon">
      <mat-icon>anchor</mat-icon>
    </span>
    <span class="topbar__brand-name">{{ appName }}</span>
  </a>

  @if (auth.isAuthenticated()) {
    <button
      type="button"
      class="topbar__search"
      matTooltip="Search (Ctrl+K)"
      aria-label="Search leads, users, employees, connectors and bankers"
      (click)="openSearch()"
    >
      <mat-icon class="topbar__search-icon">search</mat-icon>
      <span class="topbar__search-placeholder">Search leads, users, employees, connectors, bankers…</span>
    </button>
  }

  <span class="topbar__spacer"></span>

  @if (auth.isAuthenticated()) {
    <button
      mat-icon-button
      type="button"
      class="topbar__search-compact"
      aria-label="Search leads, users, employees, connectors and bankers"
      (click)="openSearch()"
    >
      <mat-icon>search</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      class="topbar__help"
      matTooltip="Help & support"
      aria-label="Help & support"
    >
      <mat-icon>help_outline</mat-icon>
    </button>
    <app-notification-icon />
    <app-user-menu />
  } @else {
    <a mat-button routerLink="/auth/login" routerLinkActive="active" class="topbar__signin">
      Sign in
    </a>
  }
</mat-toolbar>
