@if (auth.isAuthenticated()) {
  <app-topbar (menuToggle)="sidenavOpened.set(!sidenavOpened())" />

  <mat-sidenav-container class="shell-container">
    <mat-sidenav
      #sidenav
      class="shell-sidenav"
      [class.shell-sidenav--collapsed]="!isHandset() && railCollapsed()"
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="sidenavOpened()"
      (closedStart)="sidenavOpened.set(false)"
      (click)="isHandset() && sidenav.close()"
    >
      <app-sidebar class="shell-sidenav__nav" [collapsed]="!isHandset() && railCollapsed()" />

      @if (!isHandset()) {
        <button
          type="button"
          class="shell-sidenav__collapse-toggle"
          (click)="railCollapsed.set(!railCollapsed())"
        >
          <mat-icon>{{ railCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
          @if (!railCollapsed()) {
            <span>Collapse</span>
          }
        </button>
      }
    </mat-sidenav>

    <mat-sidenav-content class="shell-content">
      <main
        class="content-inner"
        [class.content-inner--with-bottom-nav]="isHandset()"
      >
        <app-breadcrumb />
        <router-outlet />
      </main>

      <!-- Inside the sidenav-content so the bottom nav shares its stacking
           context: it sits above page content but below any slide-in
           drawer / CDK dialog overlay. -->
      @if (isHandset()) {
        <app-bottom-nav (more)="sidenavOpened.set(true)" />
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <main class="content-inner guest-content">
    <router-outlet />
  </main>
}
