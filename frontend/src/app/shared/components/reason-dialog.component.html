<app-modal [title]="data.title" [showActions]="true">
  <p class="reason-dialog__message">{{ data.message }}</p>

  <mat-form-field appearance="outline" class="reason-dialog__field">
    <mat-label>{{ data.reasonLabel ?? 'Reason' }}</mat-label>
    <textarea
      matInput
      rows="3"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
      required
    ></textarea>
  </mat-form-field>

  <button modal-actions mat-button type="button" (click)="dialogRef.close()">Cancel</button>
  <button
    modal-actions
    mat-flat-button
    color="warn"
    type="button"
    [disabled]="!reason().trim()"
    (click)="submit()"
  >
    {{ data.confirmLabel ?? 'Submit' }}
  </button>
</app-modal>
