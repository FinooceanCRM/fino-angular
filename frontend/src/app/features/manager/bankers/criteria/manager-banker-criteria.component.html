<app-page-header title="Banker Criteria" subtitle="The bank products your team's leads are matched against" />

<mat-card class="banker-criteria__toolbar">
  <mat-card-content>
    <form class="banker-criteria__filters" [formGroup]="filters" (ngSubmit)="applyFilters()">
      <mat-form-field appearance="outline" class="banker-criteria__search">
        <mat-label>Search</mat-label>
        <input matInput formControlName="search" placeholder="Bank or product name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Loan type</mat-label>
        <mat-select formControlName="loanType">
          <mat-option value="">All loan types</mat-option>
          @for (type of loanTypes; track type.value) {
            <mat-option [value]="type.value">{{ type.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit">
        <mat-icon>filter_alt</mat-icon>
        Apply
      </button>
    </form>
  </mat-card-content>
</mat-card>

<mat-card class="banker-criteria__table-card">
  <mat-card-content>
    <app-table [columns]="columns" [rows]="rows()" emptyMessage="No bank products match the current filters.">
      <ng-template appTableCell="status" let-row>
        <app-status-pill
          [label]="row.is_active ? 'Active' : 'Inactive'"
          [colour]="row.is_active ? 'success' : 'default'"
        />
      </ng-template>
    </app-table>
  </mat-card-content>
</mat-card>
