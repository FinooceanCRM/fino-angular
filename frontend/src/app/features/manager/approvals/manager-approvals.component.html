<app-page-header title="Approval Center" subtitle="Everything waiting on your sign-off" icon="task_alt" />

<mat-tab-group>
  <mat-tab [label]="'Banker approvals (' + bankerPendingCount() + ')'">
    <div class="manager-approvals__tab-body">
      <app-manager-approval-list type="banker" />
    </div>
  </mat-tab>
  <mat-tab [label]="'Lead approvals (' + leadPendingCount() + ')'">
    <div class="manager-approvals__tab-body">
      <app-manager-approval-list type="lead" />
    </div>
  </mat-tab>
  <mat-tab [label]="'Document approvals (' + documentPendingCount() + ')'">
    <div class="manager-approvals__tab-body">
      <app-manager-approval-list type="document" />
    </div>
  </mat-tab>
  <mat-tab [label]="'Access approvals (' + accessPendingCount() + ')'">
    <div class="manager-approvals__tab-body">
      <app-manager-access-request-list />
    </div>
  </mat-tab>
</mat-tab-group>
