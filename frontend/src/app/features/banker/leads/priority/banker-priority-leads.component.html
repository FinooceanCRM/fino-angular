<app-bucket-nav [links]="buckets" ariaLabel="Banker lead bucket" />

<app-page-header
  title="Priority Leads"
  subtitle="Leads a Manager assigned to you directly. Request full details to unlock contact info and updates."
/>

@if (error(); as message) {
  <p class="priority-leads__error" role="alert">{{ message }}</p>
}

<app-search-input
  class="priority-leads__search"
  label="Search"
  placeholder="Search by reference or city"
  (search)="onSearch($event)"
/>

<app-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [length]="meta().total"
  [pageIndex]="meta().current_page - 1"
  [pageSize]="meta().per_page"
  emptyMessage="No priority leads right now."
  itemLabel="leads"
  (pageChange)="onPage($event)"
>
  <ng-template appTableCell="id" let-row>
    {{ row.reference }}
  </ng-template>

  <ng-template appTableCell="loan" let-row>
    {{ loanTypeLabel(row.loan_type) }}
  </ng-template>

  <ng-template appTableCell="amount" let-row>
    ₹{{ row.loan_amount | number: '1.0-0' }}
  </ng-template>

  <ng-template appTableCell="status" let-row>
    <app-status-pill [label]="row.status_label" [colour]="row.status_colour" />
  </ng-template>

  <ng-template #rowActions let-row>
    <button mat-icon-button type="button" matTooltip="View" aria-label="View" (click)="view(row)">
      <mat-icon>visibility</mat-icon>
    </button>
    @if (row.full_access) {
      <a mat-icon-button [routerLink]="['/leads', row.id]" matTooltip="Update" aria-label="Update">
        <mat-icon>edit</mat-icon>
      </a>
    } @else {
      <button
        mat-icon-button
        type="button"
        disabled
        matTooltip="Request full details to enable updates"
        aria-label="Update disabled until full access is approved"
      >
        <mat-icon>edit</mat-icon>
      </button>
    }
  </ng-template>
</app-table>
