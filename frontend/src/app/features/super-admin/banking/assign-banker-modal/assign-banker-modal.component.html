<app-modal title="Assign banker" [showActions]="true">
  <div class="assign-banker">
    <p class="assign-banker__lead">
      <strong>{{ data.lead.reference }}</strong> — {{ data.lead.applicant_name }}
      ({{ loanTypeLabel(data.lead.loan_type) }} ·
      <span class="assign-banker__amount">{{ data.lead.loan_amount | currency: 'INR' : 'symbol-narrow' : '1.0-0' }}</span>)
    </p>

    <mat-form-field appearance="outline" class="assign-banker__select">
      <mat-label>Banker</mat-label>
      <mat-select [ngModel]="selectedId()" (ngModelChange)="selectedId.set($event)">
        <mat-option [value]="null">Unassigned</mat-option>
        @for (banker of data.bankers; track banker.id) {
          <mat-option [value]="banker.id">{{ banker.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <button modal-actions mat-stroked-button type="button" (click)="dialogRef.close()">Cancel</button>
  <button modal-actions mat-flat-button color="primary" class="tide-cta-pill" type="button" (click)="confirm()">
    <mat-icon>check</mat-icon>
    Save assignment
  </button>
</app-modal>
