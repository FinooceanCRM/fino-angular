<app-user-role-tabs>
  <button
    page-header-actions
    mat-flat-button
    color="primary"
    type="button"
    disabled
    matTooltip="Roles are seeded by the platform — creating a new role isn't available yet."
  >
    <mat-icon>add</mat-icon>
    Add role
  </button>
</app-user-role-tabs>

<mat-card class="super-admin-roles__table-card">
  <mat-card-content>
    <app-table [columns]="columns" [rows]="roles()" [loading]="loading()" emptyMessage="No roles found.">
      <ng-template #rowActions let-row>
        <a
          mat-icon-button
          class="row-action row-action--view"
          [routerLink]="['/super-admin/users/permissions']"
          [queryParams]="{ role: row.value }"
          aria-label="View role permissions"
        >
          <mat-icon>visibility</mat-icon>
        </a>
        <a
          mat-icon-button
          class="row-action row-action--edit"
          [routerLink]="['/super-admin/users/permissions']"
          [queryParams]="{ role: row.value }"
          aria-label="Edit role permissions"
        >
          <mat-icon>edit</mat-icon>
        </a>
      </ng-template>
    </app-table>
  </mat-card-content>
</mat-card>
