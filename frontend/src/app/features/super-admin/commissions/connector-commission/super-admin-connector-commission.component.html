<div class="commission-page__header">
  <app-page-header
    title="Connector Commission"
    subtitle="Base commission on own leads, plus a decaying override cascading up the referral chain."
  />
  <button mat-stroked-button type="button" (click)="export()">
    <mat-icon>download</mat-icon>
    Export CSV
  </button>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="commission-page__summary">
  <app-stat-card icon="groups" [value]="summary().totalConnectors" label="Total connectors" accent="primary" />
  <app-stat-card icon="link" [value]="summary().totalReferrals" label="Total leads" accent="accent" />
  <app-stat-card icon="payments" [value]="'₹' + (summary().totalEarned | number: '1.0-0')" label="Commission earned" />
  <app-stat-card icon="trending_up" [value]="summary().conversionRate + '%'" label="Disbursal rate" />
</div>

<mat-card class="commission-page__toolbar">
  <mat-card-content>
    <form class="commission-page__filters" [formGroup]="filters">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput formControlName="search" placeholder="Name, email or referral code" />
      </mat-form-field>
    </form>
  </mat-card-content>
</mat-card>

<mat-card class="commission-page__table-card">
  <mat-card-content>
    <app-table
      [columns]="columns"
      [rows]="filteredRows()"
      [loading]="loading()"
      emptyMessage="No connectors match the current filters."
    >
      <ng-template appTableCell="earned" let-row>
        ₹{{ row.commission_accrued ?? 0 | number: '1.0-0' }}
        @if (row.commission_rate !== null) {
          ({{ row.commission_rate }}%)
        }
      </ng-template>

      <ng-template appTableCell="status" let-row>
        <app-status-pill [label]="row.status_label" [colour]="row.status_colour" />
      </ng-template>
    </app-table>
  </mat-card-content>
</mat-card>
