@if (ranked().length === 0) {
  <app-empty-state icon="trending_up" message="No employees are assigned to you yet." />
} @else {
  <div class="team-performance__stats">
    <app-stat-card icon="assignment_turned_in" [value]="totals().leadsHandled" label="Leads handled" accent="primary" />
    <app-stat-card icon="paid" [value]="totals().disbursed" label="Leads disbursed" accent="accent" />
    <app-stat-card icon="percent" [value]="totals().avgConversion + '%'" label="Avg. conversion rate" />
  </div>

  <mat-card class="team-performance__table-card">
    <mat-card-header>
      <mat-card-title>Team performance</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-table [columns]="columns" [rows]="ranked()" itemLabel="employees">
        <ng-template appTableCell="employee" let-row>
          <div class="team-performance__employee">
            <span class="team-performance__avatar">{{ initials(row.name) }}</span>
            <span class="team-performance__employee-text">
              <span class="team-performance__name">{{ row.name }}</span>
              <span class="team-performance__role">Employee</span>
            </span>
          </div>
        </ng-template>

        <ng-template appTableCell="status" let-row>
          <app-status-pill [label]="status(row).label" [colour]="status(row).colour" />
        </ng-template>
      </app-table>
    </mat-card-content>
  </mat-card>
}
