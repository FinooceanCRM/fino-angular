@if (ranked().length === 0) {
  <app-empty-state icon="trending_up" message="No employees are assigned to you yet." />
} @else {
  <div class="team-performance__stats">
    <app-stat-card icon="assignment_turned_in" [value]="totals().leadsHandled" label="Leads handled" accent="primary" />
    <app-stat-card icon="paid" [value]="totals().disbursed" label="Leads disbursed" accent="accent" />
    <app-stat-card icon="percent" [value]="totals().avgConversion + '%'" label="Avg. conversion rate" />
  </div>

  <div class="app-scroll-x">
    <table class="team-performance__table">
      <thead>
        <tr>
          <th>#</th>
          <th>Employee</th>
          <th>Leads handled</th>
          <th>Approved</th>
          <th>Disbursed</th>
          <th>Conversion</th>
        </tr>
      </thead>
      <tbody>
        @for (row of ranked(); track row.id; let i = $index) {
          <tr>
            <td>{{ i + 1 }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.leadsHandled }}</td>
            <td>{{ row.approved }}</td>
            <td>{{ row.disbursed }}</td>
            <td>{{ row.conversionRatePct }}%</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
