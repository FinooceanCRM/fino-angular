<app-task-bucket-nav [counts]="bucketCounts()" />
<app-page-header title="Follow-ups" subtitle="Calls, meetings, tasks and reminders in one place." icon="calendar_month" />

<mat-tab-group class="follow-ups__tabs" animationDuration="0ms">
  <mat-tab label="Calls">
    <app-tasks type="call" [showHeader]="false" [showStats]="false" (tasksLoaded)="onTasksLoaded($event)" />
  </mat-tab>
  <mat-tab label="Meetings">
    <app-tasks type="meeting" [showHeader]="false" [showStats]="false" />
  </mat-tab>
  <mat-tab label="Tasks">
    <app-tasks type="task" [showHeader]="false" [showStats]="false" />
  </mat-tab>
  <mat-tab label="Reminders">
    <app-tasks type="reminder" [showHeader]="false" [showStats]="false" />
  </mat-tab>
</mat-tab-group>
