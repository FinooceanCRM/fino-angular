name: FINOOCEAN - Deployment Preparation

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "GitHub Actions run ID that created the release artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: finoocean-deployment-preparation
  cancel-in-progress: false

jobs:
  inspect-release:
    name: Inspect Release Artifact (No Deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate run ID
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail

          if ! [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Release run ID must be numeric."
            exit 1
          fi

          echo "Release run ID format is valid."

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          pattern: finoocean-release-*
          path: release-download
          merge-multiple: true
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Downloaded artifact files ==="

          if [ ! -d release-download ]; then
            echo "::error::Artifact download directory does not exist."
            exit 1
          fi

          find release-download -maxdepth 3 -type f -print

          mapfile -t archives < <(
            find release-download -maxdepth 3 -type f -name '*.zip' -print
          )

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP archive, found ${#archives[@]}."
            exit 1
          fi

          ARCHIVE="${archives[0]}"

          echo
          echo "=== Validate ZIP ==="
          ls -lh "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          echo "ZIP integrity passed."

          echo
          echo "=== Validate archive paths ==="

          CONTENTS="$(unzip -Z1 "$ARCHIVE")"

          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..|..|*\\*)
                echo "::error::Unsafe archive path detected."
                exit 1
                ;;
            esac
          done <<< "$CONTENTS"

          echo "Archive path check passed."

          echo
          echo "=== Validate required Laravel files ==="

          for required in \
            "release/backend/artisan" \
            "release/backend/composer.json" \
            "release/backend/vendor/autoload.php" \
            "release/backend/public/index.php"
          do
            if ! grep -Fxq "$required" <<< "$CONTENTS"; then
              echo "::error::Required file missing: $required"
              exit 1
            fi

            echo "FOUND: $required"
          done

          echo
          echo "=== Detect Angular index.html ==="

          if ! grep -Eq \
            '^release/frontend/.*/?index\.html$|^release/frontend/index\.html$' \
            <<< "$CONTENTS"; then
            echo "::error::Angular index.html not found."
            grep '^release/frontend/' <<< "$CONTENTS" | head -n 60 || true
            exit 1
          fi

          grep -E \
            '^release/frontend/.*/?index\.html$|^release/frontend/index\.html$' \
            <<< "$CONTENTS"

          echo
          echo "=== Check environment files ==="

          if grep -Eq '(^|/)\.env($|\.)' <<< "$CONTENTS"; then
            echo "::error::Environment file detected in release archive."
            exit 1
          fi

          echo "No environment files detected."

          echo
          echo "=== Result ==="
          echo "Release artifact inspection passed."
          echo "No production server was contacted."
          echo "No files were deployed or changed."
          echo "No database commands were run."
