
name: FINOOCEAN - Deployment Preparation

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "GitHub Actions run ID that created the release artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: finoocean-deployment-preparation
  cancel-in-progress: false

jobs:
  inspect-release:
    name: Inspect Release Artifact (No Deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: finoocean-release-${{ github.sha }}
          path: release-download
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect release archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="release-download/finoocean-release.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Expected release archive not found."
            find release-download -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Release archive found."
          ls -lh "$ARCHIVE"

          echo ""
          echo "Archive contents:"
          unzip -l "$ARCHIVE"

          echo ""
          echo "Checking for environment files..."
          if unzip -Z1 "$ARCHIVE" | grep -E '(^|/)\.env($|\.)'; then
            echo "::error::Environment file detected in release archive."
            exit 1
          fi

          echo "No environment files detected."
          echo ""
          echo "Inspection completed. No server was contacted."
