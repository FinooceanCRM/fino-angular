name: FINOOCEAN - Automatic Production Deployment

on:
  workflow_run:
    workflows:
      - "FINOOCEAN - Upload Release to Namecheap"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: finoocean-production-deployment
  cancel-in-progress: false

jobs:
  validate-deployment:
    name: Validate Release Before Production
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      ENABLE_PRODUCTION_PUBLISHING: "false"

    steps:
      - name: Validate source commit
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid source commit SHA."
            exit 1
          fi

          echo "Source commit: $SOURCE_SHA"

      - name: Verify SSH secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::SSH_PRIVATE_KEY is missing."
            exit 1
          }

          test -n "$SSH_KEY_PASSPHRASE" || {
            echo "::error::SSH_KEY_PASSPHRASE is missing."
            exit 1
          }

          echo "Required SSH secrets are present."

      - name: Validate uploaded release on Namecheap
        uses: appleboy/ssh-action@v1
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          envs: SOURCE_SHA
          timeout: 30s
          command_timeout: 60s
          script: |
            set -eu

            DIR="$HOME/finoocean-releases/incoming"
            FILE="$DIR/finoocean-release-${SOURCE_SHA}.zip"
            CHECKSUM_FILE="$FILE.sha256"

            echo "=== 1. Verify exact release ==="

            test -s "$FILE" || {
              echo "ERROR: Release archive not found."
              exit 1
            }

            test -s "$CHECKSUM_FILE" || {
              echo "ERROR: Checksum sidecar not found."
              echo "Confirm the updated upload workflow has run."
              exit 1
            }

            echo "Commit: $SOURCE_SHA"
            ls -lh "$FILE" "$CHECKSUM_FILE"

            echo
            echo "=== 2. Verify checksum sidecar ==="

            EXPECTED_SHA256="$(awk 'NR == 1 {print $1}' "$CHECKSUM_FILE")"
            EXPECTED_FILENAME="$(awk 'NR == 1 {print $2}' "$CHECKSUM_FILE")"

            case "$EXPECTED_SHA256" in
              *[!0-9a-f]*|"")
                echo "ERROR: Invalid SHA-256 format."
                exit 1
                ;;
            esac

            if [ "${#EXPECTED_SHA256}" -ne 64 ]; then
              echo "ERROR: SHA-256 must contain 64 characters."
              exit 1
            fi

            EXPECTED_NAME="finoocean-release-${SOURCE_SHA}.zip"

            if [ "$EXPECTED_FILENAME" != "$EXPECTED_NAME" ]; then
              echo "ERROR: Checksum filename does not match release."
              exit 1
            fi

            ACTUAL_SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "ERROR: Archive checksum mismatch."
              exit 1
            fi

            echo "PASS: Archive matches its uploaded checksum."

            echo
            echo "=== 3. Verify ZIP integrity ==="

            unzip -t "$FILE" >/dev/null
            echo "PASS: ZIP integrity verified."

            echo
            echo "=== 4. Check archive paths and contents ==="

            CONTENTS="$(unzip -Z1 "$FILE")"

            while IFS= read -r ENTRY; do
              case "$ENTRY" in
                /*|../*|*/../*|*/..|..|*\\*)
                  echo "ERROR: Unsafe archive path detected."
                  exit 1
                  ;;
              esac
            done <<EOF
            $CONTENTS
            EOF

            for REQUIRED in \
              "release/backend/artisan" \
              "release/backend/composer.json" \
              "release/backend/vendor/autoload.php" \
              "release/backend/public/index.php"
            do
              printf '%s\n' "$CONTENTS" | grep -Fxq "$REQUIRED" || {
                echo "ERROR: Missing required file: $REQUIRED"
                exit 1
              }

              echo "FOUND: $REQUIRED"
            done

            printf '%s\n' "$CONTENTS" |
              grep -Eq '^release/frontend/([^/]+/)*index\.html$' || {
                echo "ERROR: Angular index.html missing."
                exit 1
              }

            printf '%s\n' "$CONTENTS" |
              grep -E '^release/frontend/([^/]+/)*index\.html$'

            if printf '%s\n' "$CONTENTS" |
              grep -Eq '(^|/)\.env($|\.)'; then
              echo "ERROR: Environment file detected in release."
              exit 1
            fi

            echo "PASS: No environment files detected."

            echo
            echo "=== 5. Inspect existing live paths ==="

            test -d "$HOME/public_html" || {
              echo "ERROR: Frontend document root missing."
              exit 1
            }

            test -f "$HOME/fino-deploy/backend/artisan" || {
              echo "ERROR: Laravel application missing."
              exit 1
            }

            test -f "$HOME/fino-deploy/backend/.env" || {
              echo "ERROR: Laravel .env missing."
              exit 1
            }

            test -d "$HOME/fino-deploy/backend/storage" || {
              echo "ERROR: Laravel storage missing."
              exit 1
            }

            test -L "$HOME/fino-deploy/backend/public/storage" || {
              echo "ERROR: Expected public/storage symlink missing."
              exit 1
            }

            echo "PASS: Frontend document root exists."
            echo "PASS: Laravel application and .env exist."
            echo "PASS: Laravel storage exists."
            echo "PASS: public/storage symlink exists."

            echo
            echo "=== Validation complete ==="
            echo "No archive was extracted."
            echo "No production files were changed."
            echo "No database commands were run."

      - name: Keep publishing disabled
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ENABLE_PRODUCTION_PUBLISHING" != "false" ]; then
            echo "::error::Unexpected publishing configuration."
            exit 1
          fi

          echo "All validation steps completed."
          echo "Automatic production publishing is DISABLED."
          echo "This workflow does not publish live files."
