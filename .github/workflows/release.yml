
name: FINOOCEAN - Prepare Release Package

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finoocean-release-package
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build, Validate and Package Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, intl, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend production dependencies
        working-directory: backend
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-dev \
            --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build

      - name: Assemble release directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/backend release/frontend

          rsync -a backend/ release/backend/ \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='tests/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='storage/***' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='public/storage' \
            --exclude='public/.htaccess' \
            --exclude='public/php.ini' \
            --exclude='public/.user.ini'

          cp -a frontend/dist/. release/frontend/

      - name: Validate release contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Laravel release..."

          test -f release/backend/artisan
          test -f release/backend/composer.json
          test -f release/backend/vendor/autoload.php
          test -f release/backend/public/index.php

          echo "Validating Angular release..."

          # Must match the path the deploy workflows extract from.
          if [ ! -s release/frontend/finoocean/browser/index.html ]; then
            echo "::error::release/frontend/finoocean/browser/index.html not found."
            find release/frontend -maxdepth 3 -name index.html
            exit 1
          fi

          echo "Checking environment files..."

          if find release -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "::error::Environment file found in release."
            exit 1
          fi

          echo "Checking private uploads..."

          if find release/backend/storage/app/private -type f -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Private uploaded documents found in release."
            exit 1
          fi

          echo "Checking database backup files..."

          if find release -type f \( \
            -iname '*.sql' -o \
            -iname '*.sqlite' -o \
            -iname '*.sqlite3' -o \
            -iname '*.dump' \
          \) -print -quit | grep -q .; then
            echo "::error::Database backup file found in release."
            exit 1
          fi

          echo "Checking Laravel runtime storage..."

          if find release/backend/storage -type f -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Runtime storage files found in release."
            exit 1
          fi

          echo "Checking public storage symlink..."

          if [ -L release/backend/public/storage ]; then
            echo "::error::Unexpected public/storage symlink found in release."
            exit 1
          fi

          echo "All release validation checks passed."

      - name: Create release archive
        run: zip -qr finoocean-release.zip release

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: finoocean-release-${{ github.event.workflow_run.head_sha }}
          path: finoocean-release.zip
          if-no-files-found: error
          retention-days: 7
