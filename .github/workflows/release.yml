
name: FINOOCEAN - Prepare Release Package

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finoocean-release-package
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build, Validate and Package Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, intl, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend production dependencies
        working-directory: backend
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-dev \
            --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build

      - name: Assemble release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/backend release/frontend

          rsync -a backend/ release/backend/ \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='tests/' \
            --exclude='node_modules/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*'

          cp -a frontend/dist/. release/frontend/

      - name: Validate release contents
        shell: bash
        run: |
          set -euo pipefail

          test -f release/backend/artisan
          test -f release/backend/composer.json
          test -f release/backend/vendor/autoload.php
          test -f release/backend/public/index.php

          if ! find release/frontend -type f -name index.html -print -quit | grep -q .; then
            echo "::error::Angular index.html was not found."
            exit 1
          fi

          if find release -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "::error::Environment file found in release."
            exit 1
          fi

      - name: Create release archive
        run: zip -qr finoocean-release.zip release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: finoocean-release-${{ github.event.workflow_run.head_sha }}
          path: finoocean-release.zip
          if-no-files-found: error
          retention-days: 7
