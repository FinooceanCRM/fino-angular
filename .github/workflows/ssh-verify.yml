
name: FINOOCEAN - Read-only Server Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finoocean-server-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Inspect Production Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Read-only server inventory
        uses: appleboy/ssh-action@v1
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          timeout: 15s
          command_timeout: 15s
          script: |
            set -eu

            echo "=== Connected account ==="
            whoami
            printf 'Home: %s\n' "$HOME"

            echo ""
            echo "=== Relevant directory metadata ==="

            for path in \
              "$HOME/public_html" \
              "$HOME/fino-deploy" \
              "$HOME/fino-deploy/backend" \
              "$HOME/fino-deploy/backend/public"
            do
              if [ -d "$path" ]; then
                ls -ld "$path"
              else
                printf 'Not found: %s\n' "$path"
              fi
            done

            echo ""
            echo "=== Disk space ==="
            df -h "$HOME"

            echo ""
            echo "=== Inventory completed; no files changed ==="
