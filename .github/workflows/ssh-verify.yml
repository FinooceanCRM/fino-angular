
name: FINOOCEAN - Read-only SSH Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finoocean-ssh-verification
  cancel-in-progress: true

jobs:
  verify-ssh:
    name: Verify Namecheap SSH
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -eu

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is missing."
            exit 1
          fi

          if [ -z "$SSH_KEY_PASSPHRASE" ]; then
            echo "::error::SSH_KEY_PASSPHRASE secret is missing."
            exit 1
          fi

          echo "Required SSH secrets are configured."

      - name: Verify SSH authentication
        uses: appleboy/ssh-action@v1
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          timeout: 15s
          command_timeout: 10s
          script: |
            set -eu

            echo "SSH authentication successful."

            echo "Authenticated user:"
            whoami

            echo "Home directory:"
            pwd

            echo "Home directory permissions:"
            ls -ld "$HOME"

            echo "Read-only verification completed."
