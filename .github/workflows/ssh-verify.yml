
name: FINOOCEAN - Read-only Production Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finoocean-production-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Inspect Paths and Disk Usage
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Inspect production directories
        uses: appleboy/ssh-action@v1
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          timeout: 15s
          command_timeout: 30s
          script: |
            set -eu

            echo "=== Disk usage ==="
            df -h "$HOME"

            echo ""
            echo "=== Directory sizes ==="
            for path in \
              "$HOME/public_html" \
              "$HOME/fino-deploy" \
              "$HOME/fino-deploy/backend" \
              "$HOME/fino-deploy/backend/public"
            do
              if [ -d "$path" ]; then
                du -sh "$path" 2>/dev/null || true
              fi
            done

            echo ""
            echo "=== Frontend top-level entries ==="
            find "$HOME/public_html" \
              -mindepth 1 -maxdepth 1 \
              -printf '%f\n' 2>/dev/null | head -40

            echo ""
            echo "=== Backend top-level entries ==="
            find "$HOME/fino-deploy/backend" \
              -mindepth 1 -maxdepth 1 \
              -printf '%f\n' 2>/dev/null | head -40

            echo ""
            echo "=== Laravel public entries ==="
            find "$HOME/fino-deploy/backend/public" \
              -mindepth 1 -maxdepth 1 \
              -printf '%f\n' 2>/dev/null | head -40

            echo ""
            echo "Read-only inventory completed. No files changed."
