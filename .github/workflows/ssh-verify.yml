
name: FINOOCEAN - SSH Host Key Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Inspect SSH host fingerprints
        shell: bash
        timeout-minutes: 1
        run: |
          set -eu

          HOST="business30.web-hosting.com"
          PORT="21098"
          OUTPUT="/tmp/ssh-host-keys"

          echo "Checking ED25519, ECDSA, and RSA host keys..."

          timeout 12s ssh-keyscan \
            -T 5 \
            -p "$PORT" \
            -t ed25519,ecdsa,rsa \
            "$HOST" \
            2>/dev/null > "$OUTPUT" || true

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::No SSH host keys received."
            exit 1
          fi

          echo ""
          echo "Advertised host fingerprints:"
          ssh-keygen -lf "$OUTPUT" -E sha256

          echo ""
          echo "Compare these values with fingerprints confirmed by Namecheap."
          echo "No SSH login or deployment was attempted."
