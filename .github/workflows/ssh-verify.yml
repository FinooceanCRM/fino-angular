
name: FINOOCEAN - SSH Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finoocean-ssh-diagnostic
  cancel-in-progress: true

jobs:
  diagnose-ssh:
    name: Diagnose Namecheap SSH
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check SSH server fingerprint
        shell: bash
        timeout-minutes: 1
        run: |
          set -eu

          HOST="business30.web-hosting.com"
          PORT="21098"
          OUTPUT="/tmp/ssh-host-keys"

          echo "Checking SSH host: ${HOST}:${PORT}"
          echo "Requesting ED25519 host key with a short timeout..."

          if ! timeout 8s ssh-keyscan \
            -T 5 \
            -p "$PORT" \
            -t ed25519 \
            "$HOST" \
            > "$OUTPUT" 2>/dev/null; then
            echo "Warning: ssh-keyscan did not complete successfully."
          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::No ED25519 host key received."
            echo "Check connectivity and SSH service status with Namecheap."
            exit 1
          fi

          echo ""
          echo "Advertised SSH host fingerprint(s):"
          ssh-keygen -lf "$OUTPUT" -E sha256

          echo ""
          echo "Expected fingerprint confirmed by Namecheap:"
          echo "SHA256:pIvkHveZOdtmhm6GdPDptZTyP0ekIKO4b9Fa6uSbjEg"

          echo ""
          echo "Compare the fingerprints above."
          echo "This workflow does not authenticate or modify the server."
