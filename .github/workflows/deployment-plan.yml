name: FINOOCEAN - Deployment Plan Validation

on:
  workflow_dispatch:
    inputs:
      release_filename:
        description: "Exact ZIP filename in finoocean-releases/incoming"
        required: true
        type: string
      expected_sha256:
        description: "Exact SHA-256 from the successful upload log"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finoocean-deployment-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Validate Release and Inspect Production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate release and inspect live paths
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_FILENAME: ${{ inputs.release_filename }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          envs: RELEASE_FILENAME,EXPECTED_SHA256
          timeout: 15s
          command_timeout: 60s
          script: |
            set -eu

            HOME_DIR="$HOME"
            FRONTEND="$HOME_DIR/public_html"
            APP="$HOME_DIR/fino-deploy/backend"
            INCOMING="$HOME_DIR/finoocean-releases/incoming"

            echo "=== 1. Validate inputs ==="

            if ! printf '%s' "$RELEASE_FILENAME" |
              grep -Eq '^finoocean-release-[0-9a-f]{40}\.zip$'; then
              echo "ERROR: Invalid release filename."
              exit 1
            fi

            if ! printf '%s' "$EXPECTED_SHA256" |
              grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo "ERROR: SHA-256 must be exactly 64 hex characters."
              exit 1
            fi

            ARCHIVE="$INCOMING/$RELEASE_FILENAME"

            if [ ! -f "$ARCHIVE" ] || [ ! -s "$ARCHIVE" ]; then
              echo "ERROR: Release archive missing or empty."
              exit 1
            fi

            echo "Release filename and checksum format are valid."

            echo
            echo "=== 2. Verify SHA-256 ==="

            ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

            echo "Expected SHA-256: $EXPECTED_SHA256"
            echo "Actual SHA-256:   $ACTUAL_SHA256"

            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "ERROR: Checksum mismatch. Release rejected."
              exit 1
            fi

            echo "Checksum verified."

            echo
            echo "=== 3. Verify ZIP integrity ==="

            if ! unzip -t "$ARCHIVE" >/dev/null; then
              echo "ERROR: ZIP integrity check failed."
              exit 1
            fi

            CONTENTS="$(unzip -Z1 "$ARCHIVE")"
            printf '%s\n' "$CONTENTS" > /tmp/finoocean-release-contents.txt

            echo "ZIP integrity verified."

            echo
            echo "=== 4. Inspect archive paths ==="

            while IFS= read -r entry; do
              case "$entry" in
                /*|../*|*/../*|*/..|..)
                  echo "ERROR: Unsafe archive path detected."
                  exit 1
                  ;;
                *\\*)
                  echo "ERROR: Backslash in archive path rejected."
                  exit 1
                  ;;
              esac
            done < /tmp/finoocean-release-contents.txt

            echo "No obvious unsafe archive paths found."

            echo
            echo "=== 5. Validate required Laravel files ==="

            for required in \
              "release/backend/artisan" \
              "release/backend/composer.json" \
              "release/backend/vendor/autoload.php" \
              "release/backend/public/index.php"
            do
              if ! grep -Fxq "$required" /tmp/finoocean-release-contents.txt; then
                echo "ERROR: Missing required file: $required"
                exit 1
              fi

              echo "FOUND: $required"
            done

            echo
            echo "=== 6. Detect Angular frontend layout ==="

            FRONTEND_INDEX=""

            for candidate in \
              "release/frontend/index.html" \
              "release/frontend/browser/index.html"
            do
              if grep -Fxq "$candidate" /tmp/finoocean-release-contents.txt; then
                FRONTEND_INDEX="$candidate"
                break
              fi
            done

            if [ -z "$FRONTEND_INDEX" ]; then
              echo "ERROR: Angular index.html not found in supported layouts."
              echo "Frontend entries found in archive:"
              grep '^release/frontend/' /tmp/finoocean-release-contents.txt |
                head -n 60 || true
              exit 1
            fi

            echo "Angular index found: $FRONTEND_INDEX"

            echo
            echo "=== 7. Reject environment files ==="

            if grep -Eq '(^|/)\.env($|\.)' /tmp/finoocean-release-contents.txt; then
              echo "ERROR: Environment file detected in release."
              exit 1
            fi

            echo "No .env files detected in the archive."

            echo
            echo "=== 8. Inspect production paths ==="

            df -h "$HOME_DIR"

            for path in \
              "$FRONTEND" \
              "$APP" \
              "$APP/storage/app"
            do
              if [ -d "$path" ]; then
                du -sh "$path"
              else
                echo "WARNING: Directory missing: $path"
              fi
            done

            echo
            echo "=== 9. Check critical production files ==="

            for path in \
              "$FRONTEND/index.html" \
              "$FRONTEND/.htaccess" \
              "$APP/.env" \
              "$APP/artisan" \
              "$APP/composer.json" \
              "$APP/vendor/autoload.php" \
              "$APP/public/index.php" \
              "$APP/storage" \
              "$APP/bootstrap/cache"
            do
              if [ -e "$path" ]; then
                echo "FOUND: ${path#"$HOME_DIR"/}"
              else
                echo "WARNING: MISSING: ${path#"$HOME_DIR"/}"
              fi
            done

            if [ -L "$APP/public/storage" ] &&
               [ -d "$APP/public/storage" ]; then
              echo "Laravel public storage link is accessible."
            else
              echo "WARNING: Laravel public storage link needs review."
            fi

            echo
            echo "=== 10. Deployment plan (no changes) ==="
            echo "Frontend target: $FRONTEND"
            echo "Laravel target: $APP"
            echo "Detected frontend index: $FRONTEND_INDEX"
            echo "Preserve .env, storage and uploaded files."
            echo "Preserve existing storage symlink."
            echo "Do not run database migrations."
            echo "Do not extract or replace production files."
            echo "Do not delete releases or create backups."
            echo "No database commands have been run."
            echo "LIVE DEPLOYMENT REMAINS DISABLED."

            rm -f /tmp/finoocean-release-contents.txt
```
