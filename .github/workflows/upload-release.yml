
name: FINOOCEAN - Upload Release to Namecheap

on:
  workflow_run:
    workflows: ["FINOOCEAN - Prepare Release Package"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: finoocean-release-upload
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    name: Upload Release Archive (No Deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: finoocean-release-${{ github.event.workflow_run.head_sha }}
          path: downloaded-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and prepare archive
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="downloaded-release/finoocean-release.zip"
          TARGET="finoocean-release-${RELEASE_SHA}.zip"

          test -s "$SOURCE"
          unzip -t "$SOURCE" >/dev/null

          if unzip -Z1 "$SOURCE" | grep -Eq '(^|/)\.env($|\.)'; then
            echo "::error::Environment file detected in release archive."
            exit 1
          fi

          cp "$SOURCE" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Release archive validated."
          ls -lh "$TARGET"
          echo "SHA-256: $SHA256"

      - name: Prepare separate incoming directory
        uses: appleboy/ssh-action@v1
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          timeout: 15s
          command_timeout: 15s
          script: |
            set -eu
            mkdir -p "$HOME/finoocean-releases/incoming"
            chmod 700 "$HOME/finoocean-releases"
            chmod 700 "$HOME/finoocean-releases/incoming"
            echo "Incoming directory ready."
            echo "Live application files have not been changed."

      - name: Transfer archive through SCP
        uses: appleboy/scp-action@v1
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          source: finoocean-release-${{ github.event.workflow_run.head_sha }}.zip
          target: /home/finovobw/finoocean-releases/incoming/
          timeout: 15s
          command_timeout: 60s
          overwrite: false

      - name: Verify uploaded archive
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA256: ${{ steps.validate.outputs.sha256 }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: business30.web-hosting.com
          username: finovobw
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: SHA256:MU+S31vKsYEjlh13tq7xBCGSLLHMYdzAGTZojQSDpMo
          envs: EXPECTED_SHA256,RELEASE_SHA
          timeout: 15s
          command_timeout: 15s
          script: |
            set -eu

            FILE="$HOME/finoocean-releases/incoming/finoocean-release-${RELEASE_SHA}.zip"
            test -s "$FILE"

            ACTUAL_SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "ERROR: Uploaded archive checksum does not match."
              exit 1
            fi

            echo "SUCCESS: Release archive uploaded and verified."
            echo "Commit: $RELEASE_SHA"
            echo "Location: $FILE"
            ls -lh "$FILE"
            echo "No production deployment was performed."
